name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:

  file-size-check:
    name: File Size Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check File Sizes
        run: |
          echo "Checking files larger than 1 MB..."

          large_files=$(find . -type f \
            -not -path './.git/*' \
            -size +1M)

          if [ -n "$large_files" ]; then
            echo "ERROR: Files larger than 1 MB found:"
            echo "$large_files"
            exit 1
          fi

          echo "All files are within the 1 MB limit."

  branch-name-check:
    name: Branch Name Check
    runs-on: ubuntu-latest

    steps:
      - name: Validate Branch Name
        run: |
          BRANCH="${{ github.head_ref }}"

          echo "Branch: $BRANCH"

          if [[ "$BRANCH" =~ ^(feature|fix|docs)/.+ ]]; then
            echo "Valid branch name."
          else
            echo "Invalid branch name: $BRANCH"
            echo "Branch must follow:"
            echo "feature/*"
            echo "fix/*"
            echo "docs/*"
            exit 1
          fi

  pr-body-check:
    name: PR Description Check
    runs-on: ubuntu-latest

    steps:
      - name: Check PR Description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ]; then
            echo "::warning::PR description is empty."
          else
            echo "PR description exists."
          fi
