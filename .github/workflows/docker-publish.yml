name: CI/CD Pipeline for Docker

on:
  push:
    branches:
      - main
      - feature/**

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Print Branch
        run: |
          echo "Branch Name: ${{ github.ref_name }}"
          echo "Git SHA: $GITHUB_SHA"
          echo "Short SHA: $SHORT_SHA"

      - name: Print Docker Username
        run: |
          echo "Docker Username: ${{ secrets.DOCKER_USERNAME }}"

      # Build only for feature branches & PRs
      - name: Build Docker Image
        if: github.ref_name != 'main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: webapp:latest

      # Login only on main
      - name: Login to Docker Hub
        if: github.ref_name == 'main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Print Image Name
        if: github.ref_name == 'main'
        run: |
          echo "Image 1: ${{ secrets.DOCKER_USERNAME }}/webapp:latest"
          echo "Image 2: ${{ secrets.DOCKER_USERNAME }}/webapp:sha-${{ env.SHORT_SHA }}"

      # Build & Push only on main
      - name: Build and Push Docker Image
        if: github.ref_name == 'main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/webapp:latest
            ${{ secrets.DOCKER_USERNAME }}/webapp:sha-${{ env.SHORT_SHA }}

      - name: Success Message
        if: success()
        run: |
          echo "=================================="
          echo " Docker Image Built Successfully"
          echo " Image: ${{ secrets.DOCKER_USERNAME }}/webapp"
          echo " Tag: latest"
          echo " Tag: sha-${{ env.SHORT_SHA }}"
          echo "=================================="
