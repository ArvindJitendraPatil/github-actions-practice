name: CI/CD Pipeline for Docker Build & Push image

on:
  push:
    branches:
      - main
      - feature/**

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Print Branch & SHA
        run: |
          echo "Branch Name: ${{ github.ref_name }}"
          echo "Git SHA: $GITHUB_SHA"
          echo "Short SHA: $SHORT_SHA"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/webapp:latest
            ${{ secrets.DOCKER_USERNAME }}/webapp:sha-${{ env.SHORT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/webapp:${{ github.ref_name }}

      - name: Success Message
        if: success()
        run: |
          echo "=================================="
          echo " Docker Image Built & Pushed Successfully"
          echo " Repo: ${{ secrets.DOCKER_USERNAME }}/webapp"
          echo " Tags:"
          echo "   - latest"
          echo "   - sha-${{ env.SHORT_SHA }}"
          echo "   - ${{ github.ref_name }}"
          echo "=================================="
